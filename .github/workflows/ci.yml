name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    # Fork submissions do not execute Actions. After review, the owner may
    # explicitly bring approved changes onto a repository-owned branch.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: System build tools
        run: sh tools/ci_prerequisites.sh
      - name: Free runner disk space
        run: sh tools/ci_cleanup.sh prepare
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
      - name: Public dependencies
        run: python3 tools/bootstrap.py
      - name: Pinned release compiler
        run: .venv/bin/python tools/install_toolchain.py
      - name: Build, tests and publication audits
        run: sh tools/ci.sh
      - name: Clean transient build storage
        if: ${{ always() }}
        run: sh tools/ci_cleanup.sh finish

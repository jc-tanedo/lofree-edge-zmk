# Experimental combined build; sizes must pass compiled boot/Studio/BLE stack tests.
# USB-only accepted builds retain their existing stack sizes.
# Baseline BLE boot measured main400, IRQ392, idle72, workq384 bytes.
CONFIG_MAIN_STACK_SIZE=768
CONFIG_ISR_STACK_SIZE=896
# Connected pad wake reschedules through slice_reset -> clock-timeout division.
# Observed264B use needs >=128B spare plus the4B sentinel;384B was insufficient.
CONFIG_IDLE_STACK_SIZE=448
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1536
CONFIG_ZMK_KSCAN_EVENT_QUEUE_SIZE=16
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_STACK_SENTINEL=y

# Before-reset Studio encoding uses1712 bytes; post-reset peaks alone missed it.
# Keep >=128 bytes margin; do not shrink Studio based only on later snapshots.
# Previous post-reset alpha.2 watermarks: Studio696, USB320, OTA352,
# IRQ396, work608 bytes. Revalidate all paths including power before hardware.
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=2048
CONFIG_USB_WORKQUEUE_STACK_SIZE=768
CONFIG_TLSR_USB_OTA_STACK_SIZE=1152

# Bound queued behavior storage rather than shrinking the Studio encoder stack.
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=16

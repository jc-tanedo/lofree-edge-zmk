# Input observation only. Existing keyboard/transport behavior is retained.
CONFIG_LOFREE_EDGE_MODE_SWITCH=n
CONFIG_TLSR_BLE_IGNORE_MODE_SWITCH=y
CONFIG_TLSR_USB_WIRED_POSITION_ONLY=n
CONFIG_LOFREE_EDGE_SWITCH_DIAGNOSTICS=y

# Historical input-only image does not implement Edge power policy.
CONFIG_TLSR_BLE_DEEP_SLEEP=n
CONFIG_TLSR_BLE_LOW_POWER=n
CONFIG_SOC_TLSR8278_SUSPEND=n
CONFIG_TLSR_GPIO_MATRIX_SLEEP=n
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=y

CONFIG_TLSR_BOARD_DEEP_SLEEP_PADS=n

# Bring-up only: use the fork's native TLSR stack, not Zephyr Bluetooth.
CONFIG_ZMK_BLE=n
CONFIG_TLSR_BLE=y
# Preserve the agreed three-profile capacity independently of upstream defaults.
CONFIG_TLSR_BLE_PROFILES=3
# PD5/PD6 selector corroborated by physical diagnostic captures.
CONFIG_LOFREE_EDGE_MODE_SWITCH=y
CONFIG_TLSR_BLE_IGNORE_MODE_SWITCH=n
CONFIG_TLSR_USB_WIRED_POSITION_ONLY=y
CONFIG_TLSR_USB_ON_REQUEST=n
CONFIG_TLSR_BLE_DEEP_SLEEP=n
CONFIG_TLSR_BLE_LOW_POWER=n
CONFIG_TLSR_P24=n
# Use the TLSR8278 public-key engine and its upstream-sized BLE thread stack.
CONFIG_TC32_P256_PKE=y
# Stock Edge e446/e448 uses0x21 when the per-unit TX byte is blank.
CONFIG_TLSR_BLE_TX_POWER_DEFAULT=0x21
